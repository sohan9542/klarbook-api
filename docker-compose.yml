services:
  db:
    image: postgres:16
    container_name: klarbook-db
    environment:
      POSTGRES_USER: klarbook
      POSTGRES_PASSWORD: klarbook
      POSTGRES_DB: klarbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klarbook"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: klarbook-redis
    ports:
      - "6379:6379"

  s3:
    image: chrislusf/seaweedfs
    container_name: klarbook-s3
    command: server -s3 -dir=/data
    ports:
      - "9000:8333"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
